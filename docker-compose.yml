services:
  postgres-users:
    image: postgres:17-alpine
    container_name: finlytic-postgres-users
    restart: unless-stopped
    environment:
      POSTGRES_USER: users_svc
      POSTGRES_PASSWORD: users_dev_pass
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_svc -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-email:
    image: postgres:17-alpine
    container_name: finlytic-postgres-email
    restart: unless-stopped
    environment:
      POSTGRES_USER: email_svc
      POSTGRES_PASSWORD: email_dev_pass
      POSTGRES_DB: email_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-email-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_svc -d email_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finlytic-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: finlytic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: finlytic
      MINIO_ROOT_PASSWORD: finlytic_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    container_name: finlytic-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_svc
      POSTGRES_PASSWORD: test_dev_pass
      POSTGRES_DB: email_test
    ports:
      - "5435:5432"
    # No data volume, on purpose. `docker compose down` takes the contents with
    # it — a test database that outlives a crashed run lies to the next one.
    volumes:
      - ./infra/postgres-test-init.sql:/docker-entrypoint-initdb.d/10-users-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_svc -d email_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  email-ingestion-api:
    build:
      context: .
      dockerfile: services/email-ingestion/Dockerfile
      target: runtime
    image: finlytic/email-ingestion:dev
    container_name: finlytic-email-api
    restart: unless-stopped
    env_file:
      - services/email-ingestion/.env
    environment:
      # Inside the network, use the service's REAL port. 5434 is a host-side
      # mapping and does not exist here.
      DATABASE_URL: postgresql://email_svc:email_dev_pass@postgres-email:5432/email_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      # Absolute: cwd is /app, so the local ../../keys value would resolve to /keys.
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
    volumes:
      # The FILE, not the directory. Mounting ./keys would hand the private
      # signing key to a service that must never possess it (rule 3).
      - ./keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
    depends_on:
      postgres-email: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      email-ingestion-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-management-api:
    build:
      context: .
      dockerfile: services/user-management/Dockerfile
      target: runtime
    image: finlytic/user-management:dev
    container_name: finlytic-user-management-api
    restart: unless-stopped
    env_file:
      - services/user-management/.env
    environment:
      DATABASE_URL: postgresql://users_svc:users_dev_pass@postgres-users:5432/users_db?schema=public
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
    volumes:
      # The ONLY service that mounts the private key. Every other service gets the
      # public one alone — that asymmetry is architecture rule 3, made visible.
      - ./keys/jwt-private.pem:/app/keys/jwt-private.pem:ro
      - ./keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
    depends_on:
      postgres-users: { condition: service_healthy }
      user-management-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  email-ingestion-worker:
    build:
      context: .
      dockerfile: services/email-ingestion/Dockerfile
      target: runtime
    image: finlytic/email-ingestion:dev
    container_name: finlytic-email-worker
    restart: unless-stopped
    # Same image, different role — identical code and dependencies, so the API
    # and the worker cannot drift apart.
    command: ["node", "services/email-ingestion/dist/main.worker.js"]
    env_file:
      - services/email-ingestion/.env
    environment:
      DATABASE_URL: postgresql://email_svc:email_dev_pass@postgres-email:5432/email_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
    volumes:
      - ./keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
    depends_on:
      postgres-email: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      email-ingestion-migrate: { condition: service_completed_successfully }

  email-ingestion-migrate:
    build:
      context: .
      dockerfile: services/email-ingestion/Dockerfile
      target: migrator
    image: finlytic/email-ingestion-migrate:dev
    container_name: finlytic-email-migrate
    # A job, not a service. Run once, exit, stay exited.
    restart: "no"
    # Deliberately NO env_file — a migrator has no business holding the encryption key
    # or the OAuth client secrets. It needs exactly one variable.
    environment:
      DATABASE_URL: postgresql://email_svc:email_dev_pass@postgres-email:5432/email_db?schema=public
    depends_on:
      postgres-email: { condition: service_healthy }

  user-management-migrate:
    build:
      context: .
      dockerfile: services/user-management/Dockerfile
      target: migrator
    image: finlytic/user-management-migrate:dev
    container_name: finlytic-user-management-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://users_svc:users_dev_pass@postgres-users:5432/users_db?schema=public
    depends_on:
      postgres-users: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      target: runtime
    image: finlytic/gateway:dev
    container_name: finlytic-gateway
    restart: unless-stopped
    # Deliberately NO env_file — services/gateway/.env holds 127.0.0.1 URLs that
    # are correct on the host and meaningless inside the network.
    environment:
      PORT: 3000
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      JWT_ISSUER: finlytic-user-management
      JWT_AUDIENCE: finlytic
      # Service names, and the ports the services actually LISTEN on. 3001/3002
      # are unpublished here — they are container ports, not host mappings.
      USER_MANAGEMENT_URL: http://user-management-api:3001
      EMAIL_INGESTION_URL: http://email-ingestion-api:3002
    volumes:
      # Public key only. The gateway verifies; it never signs (rule 3).
      - ./keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
    ports:
      - "3000:3000"
    depends_on:
      user-management-api: { condition: service_healthy }
      email-ingestion-api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-users-data:
  postgres-email-data:
  redis-data:
  minio-data:
