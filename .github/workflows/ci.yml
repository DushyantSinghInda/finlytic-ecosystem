name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest

    env:
      # prisma generate never connects — this only satisfies env('DATABASE_URL')
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_svc
          POSTGRES_PASSWORD: test_dev_pass
          POSTGRES_DB: email_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U test_svc -d email_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify native modules load
        run: node -e "const a=require('argon2'); a.hash('probe').then(h=>console.log('argon2 ok:', h.slice(0,20)))"

      - name: Generate Prisma clients
        run: npm run prisma:generate:all

      - name: Build packages and services
        run: npm run build:all

      - name: Lint
        run: npm run lint:all
