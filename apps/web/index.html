<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finlytic</title>
  <script>
    // Deliberately inline, blocking, and in <head>. React mounts far too
    // late for this: the browser would paint one light frame before the
    // class landed, so every load in dark mode starts with a white flash.
    // Duplicating the key string is the price — an inline script cannot
    // import from theme.ts without becoming a module, which defers it.
    try {
      var stored = localStorage.getItem('finlytic.theme');
      var dark =
        stored === 'dark' ||
        (stored !== 'light' &&
          matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {
      /* localStorage blocked — fall through to light. */
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
